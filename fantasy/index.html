<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Darul Uloom Fantasy League</title>
<meta name="description" content="Private fantasy football for the Darul Uloom Winter League.">
<meta name="theme-color" content="#171412">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DU Fantasy">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 100 118" width="34" height="40" aria-hidden="true"><path d="M50 3 L94 15 V58 C94 86 74 104 50 115 C26 104 6 86 6 58 V15 Z" fill="#9b1b30" stroke="#f2ebdd" stroke-width="5"/><text x="50" y="74" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="46" fill="#f2ebdd">DU</text></svg>
    <div>
      <div class="brand-k">Darul Uloom Winter League</div>
      <div class="brand-t">Fantasy League</div>
    </div>
  </div>
  <div class="who" id="who"></div>
</header>
<nav class="tabs" id="tabs" aria-label="Screens" hidden>
  <button data-tab="pick">Pick Team</button>
  <button data-tab="transfers">Transfers</button>
  <button data-tab="points">Points</button>
  <button data-tab="league">League</button>
  <button data-tab="stats">Stats</button>
  <button data-tab="fixtures">Fixtures</button>
  <button data-tab="admin" hidden>Admin</button>
</nav>
<div id="banner" class="banner" hidden></div>
<main id="main" class="wrap"><p class="muted center pad">Loading…</p></main>
<footer class="foot wrap" id="foot"></footer>
<div id="sheet" class="sheet" hidden><div class="sheet-back" data-act="close"></div><div class="sheet-card" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script src="demo.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
